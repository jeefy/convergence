version: 2

project_name: convergence

before:
  hooks:
    - go mod download

builds:
  - id: convergence
    binary: convergence
    main: ./cmd/convergence
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/jeefy/convergence/internal/version.Version={{.Version}} -X github.com/jeefy/convergence/internal/version.Commit={{.ShortCommit}} -X github.com/jeefy/convergence/internal/version.Date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - install.sh

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# SBOMs need syft on PATH. The release workflow installs it. Without syft,
# build locally with: goreleaser release --snapshot --clean --skip=publish,sbom
sboms:
  - artifacts: archive

release:
  github:
    owner: jeefy
    name: convergence
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
