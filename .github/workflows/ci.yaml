name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-test:
    name: Unit & Shell Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
      - name: Vet and gofmt
        run: make lint
      - name: Run unit tests with race detector
        run: go test -race -count=1 ./...
      - name: Coverage gate (80% floor)
        run: |
          go test -coverprofile=coverage.out ./...
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t+0 >= 80.0) ? 0 : 1 }' || { echo "::error::coverage ${total}% is below the 80% floor"; exit 1; }
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Shellcheck
        run: shellcheck -S warning install.sh tests/*.sh
      - name: Test installer script
        run: bash -n install.sh && tests/test_install.sh
      - name: Build binary
        run: make build
      - name: Validate rendered configs against the pinned agentgateway image
        run: tests/test_validate_configs.sh

  vulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  e2e-smoke:
    name: Live Container Smoke Test (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true
      - name: Build binary
        run: make build
      - name: Run local live container smoke test
        env:
          ENGINES: docker
        run: tests/test_e2e_local.sh

  e2e-podman:
    name: Live Container Smoke Test (Podman, ${{ matrix.compose-provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-test
    strategy:
      fail-fast: false
      matrix:
        compose-provider: [docker-compose, podman-compose]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true
      - name: Install rootless Podman and Compose providers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman uidmap slirp4netns pipx
          pipx install podman-compose==1.6.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/compose-bin" "$RUNNER_TEMP/podman-runtime"
          chmod 700 "$RUNNER_TEMP/podman-runtime"
          compose=$(docker info --format '{{range .ClientInfo.Plugins}}{{if eq .Name "compose"}}{{.Path}}{{end}}{{end}}')
          test -x "$compose"
          ln -s "$compose" "$RUNNER_TEMP/compose-bin/docker-compose"
          echo "$RUNNER_TEMP/compose-bin" >> "$GITHUB_PATH"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/podman-runtime" >> "$GITHUB_ENV"
      - name: Build binary
        run: make build
      - name: Run local live container smoke test
        env:
          ENGINES: podman
          COMPOSE_PROVIDER: ${{ matrix.compose-provider }}
        run: tests/test_e2e_local.sh

  e2e-kind:
    name: Live Cluster Smoke Test (KinD)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true
      - name: Create KinD Cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kind-convergence
      - name: Build binary
        run: make build
      - name: Run cluster KinD live deployment test (real chat request, scrub/restore, fail-closed)
        run: tests/test_e2e_cluster.sh
