name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-test:
    name: Unit & Shell Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
      - name: Vet and gofmt
        run: make lint
      - name: Run unit tests with race detector
        run: go test -race -count=1 ./...
      - name: Coverage summary
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
      - name: Test installer script
        run: bash -n install.sh && tests/test_install.sh
      - name: Build binary
        run: make build

  e2e-smoke:
    name: Live Container Smoke Test (Docker)
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true
      - name: Build binary
        run: make build
      - name: Run local live container smoke test
        run: tests/test_e2e_local.sh

  e2e-kind:
    name: Live Cluster Smoke Test (KinD)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true
      - name: Create KinD Cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kind-convergence
      - name: Build binary
        run: make build
      - name: Run cluster KinD live deployment test (real chat request, scrub/restore, fail-closed)
        run: tests/test_e2e_cluster.sh
